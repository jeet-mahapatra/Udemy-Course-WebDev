<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment Login</title>
    <style>
        body{
            margin: 0;
            padding: 0;
            background-color: #1c1c1c;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card{
            background-color: blue;
            border-radius: 30px;
            padding: 30px;
            width: 350px;
        }
        form{
            display: flex;
            flex-direction: column;
        }
        h2{
            color: yellow;
        }
        input{
            padding: 5px;
            margin-bottom: 10px;
            border-radius: 5px;
            
        }
        .name{
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2px;
        }
        button{
            padding: 5px;
            border-radius: 5px;
            background-color: rgb(87, 163, 87);
        }
        button:hover{
            background-color: rgb(63, 116, 63);
            cursor: pointer;
        }
        input:hover{
            border-color: red;
            
        }
    </style>
</head>
<body>
    <div class="card">
        <form action="">
            <h2>Sign Up : </h2>
            <input type="email" placeholder="Email">
            <div class="name">
                <input type="text" placeholder="First Name">
                <input type="text" placeholder="Last Name">
            </div>
            
            <input type="password" placeholder="Password">
            <button>Sign Up</button>
        </form>
    </div>
</body>
</html>
