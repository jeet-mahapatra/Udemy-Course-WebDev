<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="output.css">
</head>
<body class="bg-gray-950 flex justify-center items-center min-h-screen shadow-lg  ">
    <div class="bg-gray-600 p-8 rounded-2xl max-w-sm w-full">
        <h2 class="text-center text-2xl text-white mb-2 font-bold">Login : </h2>
        <form>
            <div class="mb-4">
                <label class="block text-lg text-white" for="">Email : </label>
                <input class="w-full px-2 py-3 border-gray-600 text-white outline-0 bg-gray-800 rounded-lg focus:ring-2 focus:ring-blue-600" type="email" placeholder="Email">
            </div>
            <div class="mb-6">
                <label class="block text-lg text-white" for="">Password : </label>
                <input  class="w-full px-2 py-3 border-gray-600 text-white outline-0 bg-gray-800 rounded-lg focus:ring-2 focus:ring-blue-600" type="password" placeholder="Password">
            </div>
            <button class=" w-full bg-blue-600 px-2 py-3 rounded-lg text-white hover:bg-blue-700 cursor-pointer shadow-2xl" type="submit">Login</button>
        </form>
    </div>
</body>
</html>
